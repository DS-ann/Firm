name: Apply BLE hardening

on:
  push:
    branches: [esp-idf-conversion]
    paths:
      - 'main/main.cpp'
      - '.github/workflows/apply-ble-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply BLE hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esp-idf-conversion

      - name: Normalize BLE state declarations
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('main/main.cpp')
          s = p.read_text()
          original = s

          # Remove every generated copy first, then insert exactly one copy.
          s = re.sub(r'^static volatile bool bleResetPending\s*=\s*false;\s*\n?', '', s, flags=re.MULTILINE)
          s = re.sub(r'^static bool bleSyncPending\[MAX_BLE_CLIENTS\]\s*=\s*\{\};\s*\n?', '', s, flags=re.MULTILINE)

          marker = 'static bool notifyEnabled[MAX_BLE_CLIENTS]={};'
          if marker not in s:
              raise SystemExit('notifyEnabled declaration not found')

          s = s.replace(
              marker,
              marker + '\nstatic bool bleSyncPending[MAX_BLE_CLIENTS]={};\nstatic volatile bool bleResetPending=false;',
              1,
          )

          # Do not start state synchronization until TX notifications are enabled.
          old = 'connectedClients[clientCount]=event->connect.conn_handle;notifyEnabled[clientCount]=false;clientCount++;syncRequested=true;if(bleRunning&&!bleStopping)startBLEAdvertising();'
          new = 'connectedClients[clientCount]=event->connect.conn_handle;notifyEnabled[clientCount]=false;bleSyncPending[clientCount]=false;clientCount++;if(bleRunning&&!bleStopping){if(clientCount<MAX_BLE_CLIENTS)startBLEAdvertising();else (void)ble_gap_adv_stop();}'
          s = s.replace(old, new, 1)

          s = s.replace(
              'connectedClients[i]=connectedClients[i+1];notifyEnabled[i]=notifyEnabled[i+1];',
              'connectedClients[i]=connectedClients[i+1];notifyEnabled[i]=notifyEnabled[i+1];bleSyncPending[i]=bleSyncPending[i+1];',
              1,
          )
          s = s.replace(
              'connectedClients[clientCount-1]=INVALID_CONN_HANDLE;notifyEnabled[clientCount-1]=false;',
              'connectedClients[clientCount-1]=INVALID_CONN_HANDLE;notifyEnabled[clientCount-1]=false;bleSyncPending[clientCount-1]=false;',
              1,
          )
          s = s.replace(
              'notifyEnabled[slot]=event->subscribe.cur_notify;if(notifyEnabled[slot])syncRequested=true;',
              'notifyEnabled[slot]=event->subscribe.cur_notify;bleSyncPending[slot]=event->subscribe.cur_notify;',
              1,
          )
          s = s.replace(
              'uint16_t len=OS_MBUF_PKTLEN(ctxt->om);if(len>=sizeof(msg))len=sizeof(msg)-1;',
              'uint16_t len=OS_MBUF_PKTLEN(ctxt->om);if(len>=sizeof(msg))return BLE_ATT_ERR_INVALID_ATTR_VALUE_LEN;',
              1,
          )

          old_sync = 'if(syncRequested){syncRequested=false;sendFullStateSync();}'
          new_sync = 'bool bleSyncNeeded=false;for(int i=0;i<MAX_BLE_CLIENTS;i++){if(bleSyncPending[i]&&connectedClients[i]!=INVALID_CONN_HANDLE&&notifyEnabled[i]){bleSyncNeeded=true;break;}}if(bleSyncNeeded){for(int i=0;i<MAX_BLE_CLIENTS;i++)bleSyncPending[i]=false;syncRequested=false;sendFullStateSync();}'
          s = s.replace(old_sync, new_sync, 1)

          if s == original:
              raise SystemExit('No BLE normalization change matched current main.cpp')
          p.write_text(s)

      - name: Verify source
        run: |
          test "$(grep -cE '^static volatile bool bleResetPending[[:space:]]*=[[:space:]]*false;' main/main.cpp || true)" -eq 1
          test "$(grep -cE '^static bool bleSyncPending\[MAX_BLE_CLIENTS\][[:space:]]*=[[:space:]]*\{\};' main/main.cpp || true)" -eq 1
          grep -q 'BLE_ATT_ERR_INVALID_ATTR_VALUE_LEN' main/main.cpp
          grep -q 'bleSyncPending' main/main.cpp
          grep -q 'ble_gap_adv_stop' main/main.cpp
          git diff --check

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main/main.cpp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No BLE changes required.'
            exit 0
          fi
          git commit -m 'Apply BLE hardening'
          git push origin HEAD:esp-idf-conversion
