name: Apply BLE hardening

on:
  push:
    branches: [esp-idf-conversion]
    paths:
      - 'main/main.cpp'
      - '.github/workflows/apply-ble-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply BLE hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esp-idf-conversion

      - name: Patch BLE lifecycle safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('main/main.cpp')
          s = p.read_text()

          # Remove every accidental duplicate/reset declaration. This is deliberately
          # limited to the BLE reset variable and does not touch command parsing,
          # usage accounting, or configuration.
          s = re.sub(r'^static volatile bool bleResetPending=false;\n', '', s, flags=re.MULTILINE)

          # Ensure exactly one per-client subscription-sync declaration.
          s = re.sub(r'^static bool bleSyncPending\[MAX_BLE_CLIENTS\]=\{\};\n', '', s, flags=re.MULTILINE)
          marker = 'static bool notifyEnabled[MAX_BLE_CLIENTS]={};\n'
          if marker not in s:
              raise SystemExit('notifyEnabled declaration not found')
          s = s.replace(marker, marker + 'static bool bleSyncPending[MAX_BLE_CLIENTS]={};\n', 1)

          # Do not request initial synchronization at CONNECT. Wait for notification
          # subscription so the client can actually receive the state.
          old = 'connectedClients[clientCount]=event->connect.conn_handle;notifyEnabled[clientCount]=false;clientCount++;syncRequested=true;if(bleRunning&&!bleStopping)startBLEAdvertising();'
          new = 'connectedClients[clientCount]=event->connect.conn_handle;notifyEnabled[clientCount]=false;bleSyncPending[clientCount]=false;clientCount++;if(bleRunning&&!bleStopping&&clientCount<MAX_BLE_CLIENTS)startBLEAdvertising();else if(clientCount>=MAX_BLE_CLIENTS)(void)ble_gap_adv_stop();'
          if old in s:
              s = s.replace(old, new, 1)

          # Keep synchronization state aligned when connection slots are compacted.
          old = 'connectedClients[i]=connectedClients[i+1];notifyEnabled[i]=notifyEnabled[i+1];'
          new = 'connectedClients[i]=connectedClients[i+1];notifyEnabled[i]=notifyEnabled[i+1];bleSyncPending[i]=bleSyncPending[i+1];'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'connectedClients[clientCount-1]=INVALID_CONN_HANDLE;notifyEnabled[clientCount-1]=false;if(clientCount>0)clientCount--;'
          new = 'connectedClients[clientCount-1]=INVALID_CONN_HANDLE;notifyEnabled[clientCount-1]=false;bleSyncPending[clientCount-1]=false;if(clientCount>0)clientCount--;'
          if old in s:
              s = s.replace(old, new, 1)

          # Schedule initial state synchronization when TX notifications are enabled.
          old = 'if(slot>=0&&event->subscribe.attr_handle==txHandle)notifyEnabled[slot]=event->subscribe.cur_notify;'
          new = 'if(slot>=0&&event->subscribe.attr_handle==txHandle){notifyEnabled[slot]=event->subscribe.cur_notify;bleSyncPending[slot]=event->subscribe.cur_notify;}'
          if old in s:
              s = s.replace(old, new, 1)

          # Reject oversized BLE writes instead of silently truncating them.
          old = 'uint16_t len=OS_MBUF_PKTLEN(ctxt->om);if(len>=sizeof(msg))len=sizeof(msg)-1;if(ble_hs_mbuf_to_flat(ctxt->om,msg,len,nullptr)!=0)return BLE_ATT_ERR_UNLIKELY;'
          new = 'uint16_t len=OS_MBUF_PKTLEN(ctxt->om);if(len>=sizeof(msg))return BLE_ATT_ERR_INVALID_ATTR_VALUE_LEN;if(ble_hs_mbuf_to_flat(ctxt->om,msg,len,nullptr)!=0)return BLE_ATT_ERR_UNLIKELY;'
          if old in s:
              s = s.replace(old, new, 1)

          # Process pending synchronization only for subscribed live clients.
          old = 'if(syncRequested){syncRequested=false;sendFullStateSync();}'
          new = 'if(syncRequested){syncRequested=false;}for(int i=0;i<MAX_BLE_CLIENTS;i++){if(bleSyncPending[i]&&connectedClients[i]!=INVALID_CONN_HANDLE&&notifyEnabled[i]){bleSyncPending[i]=false;sendFullStateSync();}}'
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Verify BLE patch invariants
        run: |
          test "$(grep -c 'static volatile bool bleResetPending' main/main.cpp || true)" -eq 0
          test "$(grep -c 'static bool bleSyncPending' main/main.cpp || true)" -eq 1
          grep -q 'BLE_ATT_ERR_INVALID_ATTR_VALUE_LEN' main/main.cpp
          grep -q 'clientCount<MAX_BLE_CLIENTS' main/main.cpp
          git diff --check

      - name: Commit BLE hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main/main.cpp
          if git diff --cached --quiet; then
            echo 'No BLE changes required.'
            exit 0
          fi
          git commit -m 'Apply BLE hardening'
          git push origin HEAD:esp-idf-conversion
