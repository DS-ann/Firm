name: Apply BLE hardening

on:
  push:
    branches:
      - esp-idf-conversion

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ble-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esp-idf-conversion
          fetch-depth: 0

      - name: Harden NimBLE runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('main/main.cpp')
          s = p.read_text()

          old = 'static constexpr int NUM_WIFI=4,NUM_RELAYS=8,MAX_BLE_CLIENTS=5,BLE_QUEUE_SIZE=30,BLE_MSG_SIZE=220;'
          new = '''static constexpr int NUM_WIFI=4,NUM_RELAYS=8,BLE_QUEUE_SIZE=30,BLE_MSG_SIZE=220;
          #if defined(CONFIG_BT_NIMBLE_MAX_CONNECTIONS) && CONFIG_BT_NIMBLE_MAX_CONNECTIONS > 0
          static constexpr int MAX_BLE_CLIENTS=(CONFIG_BT_NIMBLE_MAX_CONNECTIONS < 5 ? CONFIG_BT_NIMBLE_MAX_CONNECTIONS : 5);
          #else
          static constexpr int MAX_BLE_CLIENTS=3;
          #endif'''
          if old in s:
              s=s.replace(old,new,1)

          old = 'static bool lastSwitchState=true,blinkState=false,wifiScanActive=false,syncRequested=false,wifiConnecting=false,wifiConnected=false,mqttConnected=false,mqttStarted=false,bleRunning=false,bleReady=false,bleStopping=false;'
          new = 'static bool lastSwitchState=true,blinkState=false,wifiScanActive=false,syncRequested=false,wifiConnecting=false,wifiConnected=false,mqttConnected=false,mqttStarted=false,bleRunning=false,bleReady=false,bleStopping=false;\nstatic volatile bool bleResetPending=false;'
          if old in s:
              s=s.replace(old,new,1)

          old = 'static void bleQueuePush(const char *msg){if(!bleQueue||!bleRunning||clientCount==0||!msg)return;BleMessage m={};snprintf(m.data,sizeof(m.data),"%s",msg);(void)xQueueSend(bleQueue,&m,0);}'
          new = 'static void bleQueuePush(const char *msg){if(!bleQueue||!bleRunning||clientCount==0||!msg)return;BleMessage m={};snprintf(m.data,sizeof(m.data),"%s",msg);if(xQueueSend(bleQueue,&m,0)!=pdTRUE)ESP_LOGW(TAG,"BLE TX queue full; dropping message");}'
          if old in s:
              s=s.replace(old,new,1)

          old = 'static void startBLEAdvertising(){if(!bleRunning||!bleReady||bleStopping)return;struct ble_gap_adv_params p={};p.conn_mode=BLE_GAP_CONN_MODE_UND;p.disc_mode=BLE_GAP_DISC_MODE_GEN;int rc=ble_gap_adv_start(bleAddrType,nullptr,BLE_HS_FOREVER,&p,bleGap,nullptr);if(rc!=0&&rc!=BLE_HS_EALREADY)ESP_LOGW(TAG,"BLE advertising start failed: %d",rc);}'
          new = 'static void startBLEAdvertising(){if(!bleRunning||!bleReady||bleStopping)return;if(ble_gap_adv_active())return;struct ble_gap_adv_params p={};p.conn_mode=BLE_GAP_CONN_MODE_UND;p.disc_mode=BLE_GAP_DISC_MODE_GEN;int rc=ble_gap_adv_start(bleAddrType,nullptr,BLE_HS_FOREVER,&p,bleGap,nullptr);if(rc!=0&&rc!=BLE_HS_EALREADY)ESP_LOGW(TAG,"BLE advertising start failed: %d",rc);}'
          if old in s:
              s=s.replace(old,new,1)

          old = 'static int bleGap(struct ble_gap_event *event,void*){if(event->type==BLE_GAP_EVENT_CONNECT){if(event->connect.status==0){if(clientCount>=MAX_BLE_CLIENTS)ble_gap_terminate(event->connect.conn_handle,BLE_ERR_CONN_LIMIT);else{connectedClients[clientCount]=event->connect.conn_handle;notifyEnabled[clientCount]=false;clientCount++;syncRequested=true;if(bleRunning&&!bleStopping)startBLEAdvertising();}}else if(bleRunning&&!bleStopping){startBLEAdvertising();}}else if(event->type==BLE_GAP_EVENT_DISCONNECT){int slot=bleClientSlot(event->disconnect.conn.conn_handle);if(slot>=0){for(int i=slot;i<clientCount-1;i++){connectedClients[i]=connectedClients[i+1];notifyEnabled[i]=notifyEnabled[i+1];}connectedClients[clientCount-1]=INVALID_CONN_HANDLE;notifyEnabled[clientCount-1]=false;if(clientCount>0)clientCount--;}if(bleStopping&&clientCount==0)bleStopping=false;if(bleRunning&&!bleStopping&&clientCount<MAX_BLE_CLIENTS)startBLEAdvertising();}else if(event->type==BLE_GAP_EVENT_ADV_COMPLETE){if(bleRunning&&!bleStopping)startBLEAdvertising();}else if(event->type==BLE_GAP_EVENT_SUBSCRIBE){int slot=bleClientSlot(event->subscribe.conn_handle);if(slot>=0&&event->subscribe.attr_handle==txHandle)notifyEnabled[slot]=event->subscribe.cur_notify;}return 0;}'
          new = '''static int bleGap(struct ble_gap_event *event,void*){
          if(event->type==BLE_GAP_EVENT_CONNECT){
            if(event->connect.status==0){
              if(clientCount>=MAX_BLE_CLIENTS){(void)ble_gap_terminate(event->connect.conn_handle,BLE_ERR_CONN_LIMIT);}
              else{
                connectedClients[clientCount]=event->connect.conn_handle;
                notifyEnabled[clientCount]=false;
                clientCount++;
                syncRequested=true;
                if(bleRunning&&!bleStopping)startBLEAdvertising();
              }
            }else if(bleRunning&&!bleStopping){startBLEAdvertising();}
          }else if(event->type==BLE_GAP_EVENT_DISCONNECT){
            int slot=bleClientSlot(event->disconnect.conn.conn_handle);
            if(slot>=0){
              for(int i=slot;i<clientCount-1;i++){connectedClients[i]=connectedClients[i+1];notifyEnabled[i]=notifyEnabled[i+1];}
              if(clientCount>0)clientCount--;
              connectedClients[clientCount]=INVALID_CONN_HANDLE;
              notifyEnabled[clientCount]=false;
            }
            if(bleStopping&&clientCount==0)bleStopping=false;
            if(bleRunning&&!bleStopping&&clientCount<MAX_BLE_CLIENTS)startBLEAdvertising();
          }else if(event->type==BLE_GAP_EVENT_ADV_COMPLETE){
            if(bleRunning&&!bleStopping)startBLEAdvertising();
          }else if(event->type==BLE_GAP_EVENT_SUBSCRIBE){
            int slot=bleClientSlot(event->subscribe.conn_handle);
            if(slot>=0&&event->subscribe.attr_handle==txHandle){
              notifyEnabled[slot]=event->subscribe.cur_notify;
              if(notifyEnabled[slot])syncRequested=true;
            }
          }
          return 0;
          }'''
          if old in s:
              s=s.replace(old,new,1)

          old = 'static void initBLE(){if(nimble_port_init()!=ESP_OK){ESP_LOGE(TAG,"NimBLE initialization failed");return;}ble_svc_gap_init();ble_svc_gatt_init();if(bleInitServices()!=0){ESP_LOGE(TAG,"GATT service initialization failed");return;}ble_hs_cfg.sync_cb=bleSync;nimble_port_freertos_init(bleHostTask);}'
          new = '''static void bleReset(int reason){
          ESP_LOGW(TAG,"NimBLE host reset: reason=%d",reason);
          bleRunning=false;bleReady=false;bleStopping=false;clientCount=0;syncRequested=false;bleResetPending=true;
          for(int i=0;i<MAX_BLE_CLIENTS;i++){connectedClients[i]=INVALID_CONN_HANDLE;notifyEnabled[i]=false;}
          }
          static void initBLE(){if(nimble_port_init()!=ESP_OK){ESP_LOGE(TAG,"NimBLE initialization failed");return;}ble_svc_gap_init();ble_svc_gatt_init();if(bleInitServices()!=0){ESP_LOGE(TAG,"GATT service initialization failed");return;}ble_hs_cfg.reset_cb=bleReset;ble_hs_cfg.sync_cb=bleSync;nimble_port_freertos_init(bleHostTask);}'''
          if old in s:
              s=s.replace(old,new,1)

          old = 'static void processBLEQueue(){if(!bleQueue||!bleRunning||clientCount==0)return;static uint64_t lastSend=0;if(nowMs()-lastSend<20)return;BleMessage message;if(xQueueReceive(bleQueue,&message,0)!=pdTRUE)return;for(int i=0;i<MAX_BLE_CLIENTS;i++){if(connectedClients[i]==INVALID_CONN_HANDLE||!notifyEnabled[i])continue;struct os_mbuf *om=ble_hs_mbuf_from_flat(message.data,strlen(message.data));if(!om)continue;int rc=ble_gatts_notify_custom(connectedClients[i],txHandle,om);if(rc!=0)os_mbuf_free_chain(om);}lastSend=nowMs();}'
          new = '''static void processBLEQueue(){
          if(!bleQueue||!bleRunning||clientCount==0)return;
          static uint64_t lastSend=0;
          if(nowMs()-lastSend<20)return;
          BleMessage message;
          if(xQueueReceive(bleQueue,&message,0)!=pdTRUE)return;
          const size_t messageLen=strnlen(message.data,sizeof(message.data));
          for(int i=0;i<MAX_BLE_CLIENTS;i++){
            uint16_t conn=connectedClients[i];
            if(conn==INVALID_CONN_HANDLE||!notifyEnabled[i])continue;
            struct os_mbuf *om=ble_hs_mbuf_from_flat(message.data,messageLen);
            if(!om){ESP_LOGW(TAG,"BLE TX buffer allocation failed");continue;}
            int rc=ble_gatts_notify_custom(conn,txHandle,om);
            if(rc!=0){ESP_LOGW(TAG,"BLE notify failed conn=%u rc=%d",conn,rc);os_mbuf_free_chain(om);}
          }
          lastSend=nowMs();
          }'''
          if old in s:
              s=s.replace(old,new,1)

          old = 'static void stopBLE(){if(!bleRunning&&!bleStopping)return;(void)ble_gap_adv_stop();bleRunning=false;bleStopping=true;for(int i=0;i<MAX_BLE_CLIENTS;i++){uint16_t handle=connectedClients[i];if(handle!=INVALID_CONN_HANDLE)(void)ble_gap_terminate(handle,BLE_ERR_REM_USER_CONN_TERM);}if(clientCount==0)bleStopping=false;}'
          new = '''static void stopBLE(){
          if(!bleRunning&&!bleStopping)return;
          (void)ble_gap_adv_stop();
          bleRunning=false;bleStopping=true;
          for(int i=0;i<MAX_BLE_CLIENTS;i++){
            uint16_t handle=connectedClients[i];
            if(handle!=INVALID_CONN_HANDLE)(void)ble_gap_terminate(handle,BLE_ERR_REM_USER_CONN_TERM);
          }
          if(clientCount==0)bleStopping=false;
          }'''
          if old in s:
              s=s.replace(old,new,1)

          old = 'static void runStateMachine(){switch(state){case WIFI_START:{'
          new = 'static void runStateMachine(){if(bleResetPending){bleResetPending=false;state=BT_START;}switch(state){case WIFI_START:{'
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main/main.cpp
          if git diff --cached --quiet; then
            echo 'No source changes required'
            exit 0
          fi
          git commit -m 'Fix BLE runtime lifecycle and notifications [ble-hardening]'
          git push origin HEAD:esp-idf-conversion
