name: Wi-Fi Repeater ESP-IDF

on:
  push:
    branches:
      - wifi-repeater-espidf
      - main
    paths:
      - 'wifi-repeater-espidf/**'
      - '.github/workflows/wifi-repeater.yml'
  pull_request:
    paths:
      - 'wifi-repeater-espidf/**'
      - '.github/workflows/wifi-repeater.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF v5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Build repeater
        working-directory: wifi-repeater-espidf
        run: |
          idf.py set-target esp32
          idf.py build

      - name: Create merged firmware binary
        working-directory: wifi-repeater-espidf
        run: |
          esptool.py --chip esp32 merge_bin \
            -o build/wifi-repeater-esp32-merged.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/wifi-repeater-espidf.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-repeater-esp32-firmware
          path: |
            wifi-repeater-espidf/build/wifi-repeater-esp32-merged.bin
            wifi-repeater-espidf/build/wifi-repeater-espidf.bin
            wifi-repeater-espidf/build/bootloader/bootloader.bin
            wifi-repeater-espidf/build/partition_table/partition-table.bin
            wifi-repeater-espidf/build/flasher_args.json
          if-no-files-found: error
