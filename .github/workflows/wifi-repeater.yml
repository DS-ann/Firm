name: Wi-Fi Repeater ESP-IDF

on:
  push:
    branches:
      - wifi-repeater-espidf
      - main
    paths:
      - 'wifi-repeater-espidf/**'
      - '.github/workflows/wifi-repeater.yml'
  pull_request:
    paths:
      - 'wifi-repeater-espidf/**'
      - '.github/workflows/wifi-repeater.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF v5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Build repeater
        working-directory: wifi-repeater-espidf
        run: |
          idf.py set-target esp32
          idf.py build

      - name: Validate application image
        working-directory: wifi-repeater-espidf
        run: |
          python "$IDF_PATH/components/esptool_py/esptool/esptool.py" \
            --chip esp32 image-info build/wifi_repeater.bin

      - name: Create complete flash image
        working-directory: wifi-repeater-espidf
        run: |
          rm -f build/wifi-repeater-esp32-merged.bin
          idf.py merge-bin \
            -o build/wifi-repeater-esp32-merged.bin \
            -f raw

      - name: Verify complete flash image
        working-directory: wifi-repeater-espidf
        run: |
          test -s build/wifi-repeater-esp32-merged.bin
          python "$IDF_PATH/components/esptool_py/esptool/esptool.py" \
            --chip esp32 image-info build/wifi-repeater-esp32-merged.bin

          SIZE=$(stat -c%s build/wifi-repeater-esp32-merged.bin)
          echo "Merged flash image size: ${SIZE} bytes"

          # The board has 2 MiB flash. Never publish an image larger than it.
          test "$SIZE" -le $((2 * 1024 * 1024))

          # Confirm the image is not suspiciously truncated.
          test "$SIZE" -ge $((0x10000 + 0x1000))

      - name: Show flash layout
        working-directory: wifi-repeater-espidf
        run: |
          cat build/flasher_args.json
          echo "--- partition table ---"
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" \
            build/partition_table/partition-table.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-repeater-esp32-firmware
          path: |
            wifi-repeater-espidf/build/wifi-repeater-esp32-merged.bin
            wifi-repeater-espidf/build/wifi_repeater.bin
            wifi-repeater-espidf/build/bootloader/bootloader.bin
            wifi-repeater-espidf/build/partition_table/partition-table.bin
            wifi-repeater-espidf/build/flasher_args.json
          if-no-files-found: error
