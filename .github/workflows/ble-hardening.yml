name: BLE hardening verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esp-idf-conversion
      - name: Inspect BLE implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f main/main.cpp
          grep -q 'BLE_GAP_EVENT_DISCONNECT' main/main.cpp
          grep -q 'BLE_GAP_EVENT_SUBSCRIBE' main/main.cpp
          grep -q 'ble_gatts_notify_custom' main/main.cpp
          grep -q 'ble_gap_adv_start' main/main.cpp
          grep -q 'ble_gap_adv_stop' main/main.cpp
          grep -q 'MQTT_EVENT_DATA' main/main.cpp
          echo 'BLE hardening checks passed'