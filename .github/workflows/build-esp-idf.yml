name: Build ESP-IDF conversion

on:
  push:
    branches:
      - esp-idf-conversion
  pull_request:
    branches:
      - esp-idf-conversion

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build native ESP-IDF firmware
        shell: bash
        run: |
          idf.py set-target esp32
          idf.py build
