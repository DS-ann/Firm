name: Convert Boot Animation

on:
  workflow_dispatch:
  push:
    paths:
      - "boot.mp4"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick zip

          command -v ffmpeg
          command -v ffprobe
          command -v convert
          command -v identify
          command -v zip

      - name: Check input video
        run: |
          test -f boot.mp4 || {
            echo "ERROR: boot.mp4 not found in repository root."
            exit 1
          }

          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            boot.mp4

      - name: Create exactly 90 frames matching 30 FPS video
        run: |
          mkdir -p frames

          ffmpeg -y \
            -i boot.mp4 \
            -vf "fps=30,scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -frames:v 90 \
            -start_number 1 \
            frames/boot_%03d.png

      - name: Verify exactly 90 frames
        run: |
          count=$(find frames -maxdepth 1 -type f -name 'boot_*.png' | wc -l)

          echo "Frames created: $count"

          if [ "$count" -ne 90 ]; then
            echo "ERROR: Expected exactly 90 frames."
            exit 1
          fi

      - name: Compress PNG files to max 200 KB
        run: |
          set -e

          for file in frames/boot_*.png; do
            echo "Compressing $file"

            success=0

            for colors in 256 128 64 32 16 8 4 2; do
              temp="${file}.tmp.png"

              convert "$file" \
                -strip \
                -colors "$colors" \
                -depth 8 \
                -define png:compression-level=9 \
                -define png:compression-filter=5 \
                -define png:compression-strategy=1 \
                "$temp"

              size=$(stat -c%s "$temp")

              if [ "$size" -le 204800 ]; then
                mv "$temp" "$file"
                echo "  OK: $size bytes ($colors colors)"
                success=1
                break
              fi

              rm -f "$temp"
            done

            if [ "$success" -ne 1 ]; then
              echo "ERROR: $file could not be compressed below 200 KB."
              echo "The requested 1080x1920 PNG + 200 KB maximum is too restrictive for this frame."
              exit 1
            fi
          done

      - name: Verify resolution and file size
        run: |
          set -e

          count=0

          for file in frames/boot_*.png; do
            count=$((count + 1))

            size=$(stat -c%s "$file")
            geometry=$(identify -format "%wx%h" "$file")

            if [ "$size" -gt 204800 ]; then
              echo "ERROR: $file is larger than 200 KB: $size bytes"
              exit 1
            fi

            if [ "$geometry" != "1080x1920" ]; then
              echo "ERROR: $file has resolution $geometry"
              exit 1
            fi
          done

          if [ "$count" -ne 90 ]; then
            echo "ERROR: Final frame count is $count, expected 90."
            exit 1
          fi

          echo "All 90 images verified."
          echo "Resolution: 1080x1920"
          echo "Frame rate: 30 FPS"
          echo "Maximum size: 200 KB"
          echo "Naming: boot_001.png ... boot_090.png"

      - name: Create ZIP
        run: |
          cd frames
          zip -9 ../boot_animation_1080x1920_90frames.zip boot_*.png
          cd ..

          echo "ZIP created:"
          ls -lh boot_animation_1080x1920_90frames.zip

      - name: Upload boot animation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: boot-animation-1080x1920-90-frames
          path: boot_animation_1080x1920_90frames.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload individual frames
        uses: actions/upload-artifact@v4
        with:
          name: boot-animation-frames
          path: frames/
          if-no-files-found: error
          retention-days: 30
