name: Convert Boot Animation

on:
  workflow_dispatch:
  push:
    paths:
      - "boot.mp4"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick zip python3

          command -v ffmpeg
          command -v ffprobe
          command -v convert
          command -v identify
          command -v zip
          command -v python3

      - name: Check input video
        run: |
          test -f boot.mp4 || {
            echo "ERROR: boot.mp4 not found in repository root."
            exit 1
          }

          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            boot.mp4

      - name: Create exactly 90 frames
        run: |
          mkdir -p frames

          ffmpeg -y \
            -i boot.mp4 \
            -vf "fps=30,scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -frames:v 90 \
            -start_number 1 \
            frames/boot_%03d.png

      - name: Verify exactly 90 frames
        run: |
          count=$(find frames -maxdepth 1 -type f -name 'boot_*.png' | wc -l)

          echo "Frames created: $count"

          if [ "$count" -ne 90 ]; then
            echo "ERROR: Expected exactly 90 frames."
            exit 1
          fi

      - name: Ensure every PNG is at least 200 KiB
        run: |
          set -e

          python3 <<'PY'
          import os
          import struct
          import zlib

          MIN_SIZE = 200 * 1024

          def png_chunk(kind, data):
              return (
                  struct.pack(">I", len(data)) +
                  kind +
                  data +
                  struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          for name in sorted(os.listdir("frames")):
              if not name.endswith(".png"):
                  continue

              path = os.path.join("frames", name)
              size = os.path.getsize(path)

              if size >= MIN_SIZE:
                  print(f"{name}: {size} bytes - already >= 200 KiB")
                  continue

              # Add valid PNG tEXt ancillary chunks containing padding.
              # This changes file size only; the decoded image remains identical.
              needed = MIN_SIZE - size

              with open(path, "rb") as f:
                  data = f.read()

              if not data.startswith(b"\\x89PNG\\r\\n\\x1a\\n"):
                  raise RuntimeError(f"{name}: not a valid PNG")

              # Insert padding before IEND.
              iend = data.rfind(b"IEND")
              if iend < 4:
                  raise RuntimeError(f"{name}: IEND chunk not found")

              iend_start = iend - 4
              padding_payload_size = max(1, needed - 12)

              # tEXt keyword + NUL + padding text.
              keyword = b"padding"
              payload = keyword + b"\\x00" + (b"0" * max(0, padding_payload_size - len(keyword) - 1))
              chunk = png_chunk(b"tEXt", payload)

              # If rounding leaves us short, add another valid chunk.
              new_data = data[:iend_start] + chunk + data[iend_start:]

              while len(new_data) < MIN_SIZE:
                  extra = MIN_SIZE - len(new_data)
                  payload_len = max(1, extra - 12)
                  payload = b"pad" + b"\\x00" + (b"0" * max(0, payload_len - 4))
                  chunk = png_chunk(b"tEXt", payload)
                  new_data = new_data[:iend_start] + chunk + new_data[iend_start:]
                  iend_start += len(chunk)

              with open(path, "wb") as f:
                  f.write(new_data)

              final_size = os.path.getsize(path)
              if final_size < MIN_SIZE:
                  raise RuntimeError(f"{name}: could not reach 200 KiB")

              print(f"{name}: padded from {size} to {final_size} bytes")

          PY

      - name: Verify resolution and minimum file size
        run: |
          set -e

          count=0

          for file in frames/boot_*.png; do
            count=$((count + 1))

            size=$(stat -c%s "$file")
            geometry=$(identify -format "%wx%h" "$file")

            if [ "$size" -lt 204800 ]; then
              echo "ERROR: $file is smaller than 200 KiB: $size bytes"
              exit 1
            fi

            if [ "$geometry" != "1080x1920" ]; then
              echo "ERROR: $file has resolution $geometry"
              exit 1
            fi
          done

          if [ "$count" -ne 90 ]; then
            echo "ERROR: Final frame count is $count, expected 90."
            exit 1
          fi

          echo "All 90 images verified."
          echo "Resolution: 1080x1920"
          echo "Frame rate: 30 FPS"
          echo "Minimum size: 200 KiB"
          echo "Naming: boot_001.png ... boot_090.png"

      - name: Create ZIP
        run: |
          cd frames
          zip -9 ../boot_animation_1080x1920_90frames.zip boot_*.png
          cd ..

          echo "ZIP created:"
          ls -lh boot_animation_1080x1920_90frames.zip

      - name: Upload boot animation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: boot-animation-1080x1920-90-frames
          path: boot_animation_1080x1920_90frames.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload individual frames
        uses: actions/upload-artifact@v4
        with:
          name: boot-animation-frames
          path: frames/
          if-no-files-found: error
          retention-days: 30
