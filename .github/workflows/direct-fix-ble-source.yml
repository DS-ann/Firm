name: Direct BLE source cleanup

on:
  push:
    branches: [esp-idf-conversion]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esp-idf-conversion
          fetch-depth: 0

      - name: Remove duplicate BLE reset declaration and normalize GATT sentinels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main/main.cpp')
          s = p.read_text()
          decl = 'static volatile bool bleResetPending=false;'
          count = s.count(decl)
          if count == 0:
              raise SystemExit('bleResetPending declaration not found')
          s = s.replace(decl, '')
          anchor = 'static bool bleSyncPending[MAX_BLE_CLIENTS]={};'
          if s.count(anchor) != 1:
              raise SystemExit(f'expected exactly one bleSyncPending declaration, found {s.count(anchor)}')
          s = s.replace(anchor, anchor + '\nstatic volatile bool bleResetPending=false;', 1)
          if s.count(decl) != 1:
              raise SystemExit(f'expected exactly one bleResetPending declaration after patch, found {s.count(decl)}')
          p.write_text(s)
          print(f'removed {count-1} duplicate declaration(s)')
          PY

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc 'static volatile bool bleResetPending=false;' main/main.cpp)" -eq 1
          test "$(grep -Fc 'static bool bleSyncPending[MAX_BLE_CLIENTS]={};' main/main.cpp)" -eq 1
          grep -n 'bleResetPending\|bleSyncPending' main/main.cpp

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- main/main.cpp; then
            echo 'No source change required.'
            exit 0
          fi
          git add main/main.cpp
          git commit -m 'Fix duplicate BLE reset declaration in firmware'
          git push origin HEAD:esp-idf-conversion